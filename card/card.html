<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>

    <div class="header">
        <h1>Ghost Strides</h1>
    </div>

    <div class="card-container">

            <h2>Koley</h2>
            <p>Class: Half cat</p>

            <img src="https://i.pinimg.com/736x/1c/86/a9/1c86a9970085fd2645390f99b9ed276f.jpg" width="100px">
            
        </div>
        
        <div class="card1">
            <h2>Arlan</h2>
            <p>Class: Demon</p>
            <p>Interest: Smoke and Gym</p>
            <img src="https://i.pinimg.com/736x/e5/a6/d3/e5a6d3816987369f48badd494b7a190d.jpg" width="100px">
            
        </div>
        
        <div class="card2">
            <h2>Cel</h2>
            <p>Class: Human</p>

            <img src="https://i.pinimg.com/736x/26/76/88/267688de498ab6e06e42721c9a1fe84c.jpg" width="100px">
            
        </div>
        
        <div class="card3">
            <h2>Reno</h2>
            <p>Class: Half dragon</p>

            <img src="https://i.pinimg.com/736x/ac/ce/f7/accef73fabadbe8670e063d23665e2d9.jpg" width="100px">
            
        </div>
        
        <div class="card4">
            <h2>Rin</h2>
            <p>Class: Half robot</p>
            <p>Interest: Dance and sing</p>
            <img src="https://i.pinimg.com/736x/63/3d/a0/633da0c7360d21980645432576b3f847.jpg" width="100px">
            
        </div>
        
        <div class="card5">
            <h2>Mio</h2>
            <p>Class: Half dragon</p>
            <p>Interest: Stream</p>
            <img src="https://i.pinimg.com/736x/d9/e6/f5/d9e6f5101891b697ba0901f622d910a3.jpg" width="100px">
        </div>
    </div>

</html>
